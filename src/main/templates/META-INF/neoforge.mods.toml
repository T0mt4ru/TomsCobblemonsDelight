modLoader = "javafml" #mandatory
loaderVersion = "${loader_version_range}" #mandatory
license = "${mod_license}"
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional
[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${mod_version}" #mandatory
# A display name for the mod
displayName = "${mod_name}" #mandatory
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional
displayURL = "https://www.curseforge.com/minecraft/mc-mods/tomtarus-cobblemon-farmers-delight-tweaks" #optional
logoFile="logo.png" #optional
credits="Thanks to the Cobblemon Team and Vectorwing, the creators of the mods this mod connects." #optional
authors = "${mod_authors}" #optional
description = '''${mod_description}'''

## The [[mixins]] block
[[mixins]]
config="${mod_id}.mixins.json"

## The [[accessTransformers]] block
#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

## Dependency block
[[dependencies."${mod_id}"]] #optional

modId = "neoforge" #mandatory
type = "required" #mandatory
versionRange = "${neo_version_range}" #mandatory
ordering = "NONE"
side = "BOTH"


[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "cobblemon"
type = "required"
versionRange = "[1.6,)"
ordering = "AFTER"
side = "BOTH"
reason = "This mod adds compat features between Cobblemon and Farmer's Delight, and cannot function without Cobblemon installed."

[[dependencies."${mod_id}"]]
modId = "farmersdelight"
type = "required"
versionRange = "[1.3,)"
ordering = "AFTER"
side = "BOTH"
reason = "This mod adds compat features between Cobblemon and Farmer's Delight, and cannot function without Farmer's Delight installed."


#[features."${mod_id}"]
#openGLVersion="[3.2,)"
